<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaVibe 🐠</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{--ae:#0c4a6e;--am:#0ea5e9;--ac:#e0f2fe;--va:#10b981;--sb:0 4px 20px rgba(14,165,233,.15)}
body{background:linear-gradient(135deg,#e0f2fe,#bae6fd);min-height:100vh}
.tela{display:none;min-height:100vh;padding:2rem 1.5rem}.ativa{display:block}
.marca{text-align:center;margin-bottom:2rem;padding-top:1rem}.marca h1{font-size:2.2rem;color:var(--ae)}.marca span{color:var(--va)}.marca p{color:#475569;margin-top:.3rem}
.cartao{background:#fff;border-radius:20px;padding:2rem;box-shadow:var(--sb);max-width:420px;margin:0 auto}
.cartao h2{text-align:center;color:var(--ae);margin-bottom:1.5rem;font-size:1.4rem}
.ajuda{text-align:center;color:#64748b;margin-bottom:1rem;font-size:.95rem}
.grupo-input{margin-bottom:1.2rem}label{display:block;margin-bottom:.5rem;color:#334155;font-weight:500}
input,select{width:100%;padding:.9rem 1rem;border:2px solid #e2e8f0;border-radius:12px;font-size:1rem}
input:focus,select:focus{outline:none;border-color:var(--am)}
.btn{width:100%;padding:1rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn-principal{background:linear-gradient(90deg,#0ea5e9,#06b6d4);color:#fff;margin-top:.5rem}
.btn-secundario{background:transparent;color:var(--am);margin-top:.8rem}
.btn-perigo{background:#fee2e2;color:#dc2626;margin-top:1rem}
.btn-pequeno{padding:.6rem 1rem;font-size:.9rem;width:auto;display:inline-block;margin:.3rem}
.link{text-align:center;margin-top:1.2rem;font-size:.95rem;color:#64748b}.link span{color:var(--am);font-weight:600;cursor:pointer}
.mensagem{padding:1rem;border-radius:12px;margin:1rem 0;text-align:center;display:none}
.mensagem.sucesso{background:#d1fae5;color:#065f46;display:block}.mensagem.erro{background:#fee2e2;color:#991b1b;display:block}
.cabecalho-app{background:#fff;padding:1.2rem;border-radius:0 0 24px 24px;box-shadow:var(--sb);margin-bottom:1.5rem}
.cabecalho-app h2{color:var(--ae);font-size:1.4rem}.cabecalho-app p{color:#64748b;margin-top:.3rem}
.seletor-aquario{margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap}
.tag-aquario{background:var(--ac);padding:.5rem 1rem;border-radius:20px;font-size:.9rem;color:var(--ae);font-weight:500;cursor:pointer}
.tag-aquario.ativo{background:var(--am);color:#fff}.tag-novo{border:2px dashed #0ea5e9}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;max-width:500px;margin:0 auto}
.card-funcao{background:#fff;border-radius:16px;padding:1.5rem;text-align:center;box-shadow:var(--sb);cursor:pointer;transition:.3s}
.card-funcao:hover{transform:translateY(-5px)}.icone{font-size:2rem;margin-bottom:.5rem}
.card-funcao h3{color:var(--ae);font-size:1rem}.card-funcao p{color:#94a3b8;font-size:.8rem;margin-top:.3rem}
