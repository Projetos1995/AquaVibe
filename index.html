<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaVibe</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
        :root{--azul-escuro:#0c4a6e;--azul-medio:#0ea5e9;--azul-claro:#e0f2fe;--verde-aqua:#10b981;--sombra:0 4px 20px rgba(14,165,233,0.15);}
        body{background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%);min-height:100vh;}
        .tela{display:none;min-height:100vh;padding:2rem 1.5rem;}
        .ativa{display:block;}
        .marca{text-align:center;margin-bottom:2rem;padding-top:1rem;}
        .marca h1{font-size:2.2rem;color:var(--azul-escuro);}
        .marca span{color:var(--verde-aqua);}
        .marca p{color:#475569;margin-top:.3rem;}
        .cartao{background:white;border-radius:20px;padding:2rem;box-shadow:var(--sombra);max-width:420px;margin:0 auto;}
        .cartao h2{text-align:center;color:var(--azul-escuro);margin-bottom:1.5rem;font-size:1.4rem;}
        .grupo-input{margin-bottom:1.2rem;}
        label{display:block;margin-bottom:.5rem;color:#334155;font-weight:500;font-size:.95rem;}
        input,select{width:100%;padding:.85rem 1rem;border:2px solid #e2e8f0;border-radius:12px;font-size:1rem;transition:border .3s;}
        input:focus,select:focus{outline:none;border-color:var(--azul-medio);}
        .btn{width:100%;padding:1rem;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .2s;}
        .btn:active{transform:scale(.98);}
        .btn-principal{background:linear-gradient(90deg,#0ea5e9,#06b6d4);color:white;margin-top:.5rem;}
        .btn-secundario{background:transparent;color:var(--azul-medio);margin-top:.8rem;}
        .link{text-align:center;margin-top:1.2rem;font-size:.95rem;color:#64748b;}
        .link span{color:var(--azul-medio);font-weight:600;cursor:pointer;}
        .link span:hover{text-decoration:underline;}
        
        /* Cabecalho App */
        .cabecalho-app{background:white;padding:1.2rem;border-radius:24px;box-shadow:var(--sombra);max-width:500px;margin:0 auto 1.5rem auto;}
        .cabecalho-app h2{color:var(--azul-escuro);font-size:1.4rem;display:flex;align-items:center;justify-content:space-between;}
        .cabecalho-app p{color:#64748b;margin-top:.3rem;}
        .seletor-aquario{margin-top:.8rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
        .tag-aquario{background:var(--azul-claro);padding:.5rem 1rem;border-radius:20px;font-size:.9rem;color:var(--azul-escuro);font-weight:500;cursor:pointer;user-select:none;}
        .tag-aquario.ativo{background:var(--azul-medio);color:white;}
        .tag-novo{background:#e0f2fe;border:2px dashed #0ea5e9;}
        
        /* Layout de Grades */
        .grade{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;max-width:500px;margin:0 auto;}
        .card-funcao{background:white;border-radius:16px;padding:1.5rem;text-align:center;box-shadow:var(--sombra);cursor:pointer;transition:all .3s;}
        .card-funcao:hover{transform:translateY(-5px);}
        .icone{font-size:2rem;margin-bottom:.5rem;}
        .card-funcao h3{color:var(--azul-escuro);font-size:1rem;}
        .card-funcao p{color:#94a3b8;font-size:.8rem;margin-top:.3rem;}
        .card-admin{background:linear-gradient(135deg,#fbbf24,#f59e0b)!important;}
        .card-admin h3,.card-admin p{color:white!important;}
        
        .rodape{text-align:center;margin-top:3rem;color:#94a3b8;font-size:.85rem;}
        .sair{max-width:200px;margin:2rem auto 0;}
        
        /* Subtelas */
        .sub-tela{display:none;max-width:500px;margin:0 auto;padding:1rem 0;}
        .sub-ativa{display:block;}
        .voltar{display:inline-flex;align-items:center;gap:.5rem;color:var(--azul-medio);cursor:pointer;margin-bottom:1rem;font-weight:500;user-select:none;}
        .voltar:hover{color:var(--azul-escuro);}
        
        /* Dados e Listas */
        .cartao-dados{background:white;border-radius:16px;padding:1.5rem;box-shadow:var(--sombra);margin-bottom:1rem;}
        .cartao-dados h3{color:var(--azul-escuro);margin-bottom:1rem;}
        .dado-linha{display:flex;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid #f1f5f9;}
        .dado-linha:last-child{border-bottom:none;}
        .valor-bom{color:var(--verde-aqua);font-weight:600;}
        .valor-alerta{color:#f59e0b;font-weight:600;}
        .sem-dados{text-align:center;padding:2rem;color:#94a3b8;}
        .busca-box{display:flex;gap:.5rem;margin-bottom:1rem;}
        .busca-box input{flex:1;}
        .filtros{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;}
        .filtro-btn{padding:.5rem 1.2rem;border-radius:20px;border:2px solid var(--azul-medio);background:white;color:var(--azul-medio);cursor:pointer;font-weight:600;font-size:.9rem;}
        .filtro-btn.ativo{background:var(--azul-medio);color:white;}
        
        .grade-peixes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem;}
        .peixe-card{background:white;border-radius:14px;padding:1rem;text-align:center;box-shadow:var(--sombra);cursor:pointer;transition:all .25s;border:3px solid transparent;}
        .peixe-card:hover{transform:translateY(-4px);border-color:var(--azul-medio);}
        .peixe-emoji{font-size:2.5rem;margin-bottom:.4rem;}
        .peixe-card h4{color:var(--azul-escuro);font-size:.95rem;}
        .tipo-tag{display:inline-block;margin-top:.4rem;padding:.15rem .6rem;border-radius:10px;font-size:.7rem;font-weight:600;}
        .tipo-doce{background:#dbeafe;color:#1e40af;}
        .tipo-marinho{background:#cffafe;color:#155e75;}
        
        .admin-badge{background:#fbbf24;color:#78350f;padding:.2rem .6rem;border-radius:10px;font-size:.75rem;font-weight:700;margin-left:.5rem;display:none;}
        
        /* Painel Calculadoras */
        .calc-abas{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem;}
        .calc-aba-btn{padding:.6rem .9rem;border-radius:10px;border:2px solid var(--azul-medio);background:white;color:var(--azul-medio);cursor:pointer;font-weight:600;font-size:.85rem;transition:all .2s;}
        .calc-aba-btn.ativo{background:var(--azul-medio);color:white;}
        .calc-painel{display:none;}
        .calc-painel.ativo{display:block;animation:fadeIn .3s ease;}
        
        @keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
        .calc-card{background:white;border-radius:16px;padding:1.5rem;box-shadow:var(--sombra);margin-bottom:1rem;}
        .calc-card h3{color:var(--azul-escuro);margin-bottom:1rem;font-size:1.1rem;}
        
        .resultado{background:linear-gradient(135deg,#e0f2fe,#cff6fe);padding:1rem 1.2rem;border-radius:12px;border-left:4px solid #0369a1;color:#0c4a6e;margin-top:1rem;display:none;}
        .resultado.visivel{display:block;}
        .resultado h4{margin-bottom:.7rem;color:var(--azul-escuro);}
        .resultado p{margin:.4rem 0;font-size:.95rem;}
        .resultado strong{color:#0369a1;font-weight:700;}
        .dica{margin-top:.7rem;padding:.6rem;background:#fef3c7;border-radius:8px;color:#92400e;font-size:.85rem;}
        .linhas{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
        button.calc-btn{margin-top:.5rem;width:100%;padding:.9rem;background:linear-gradient(135deg,#0369a1,#0891b2);color:white;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:opacity .2s;}
        button.calc-btn:hover{opacity:.9;}
        .calc-grupo{margin-bottom:1rem;padding:1rem;background:#f8fafc;border-radius:10px;}
        .calc-grupo h4{color:var(--azul-escuro);margin-bottom:.8rem;font-size:.95rem;}
    </style>
</head>
<body>

    <!-- TELA LOGIN -->
    <section id="tela-login" class="tela ativa">
        <div class="marca"><h1>Aqua<span>Vibe</span></h1><p>Sinta a vida do seu aquário</p></div>
        <div class="cartao">
            <h2>Entrar na conta</h2>
            <div class="grupo-input"><label>E-mail</label><input type="email" id="email-login" value="admin@aquavibe.com"></div>
            <div class="grupo-input"><label>Senha</label><input type="password" id="senha-login" value="admin123"></div>
            <button class="btn btn-principal" onclick="entrar()">Entrar</button>
            <div class="link"><span onclick="mostrarTela('tela-cadastro')">Não tem conta? Cadastre-se</span></div>
        </div>
    </section>

    <!-- TELA CADASTRO -->
    <section id="tela-cadastro" class="tela">
        <div class="marca"><h1>Aqua<span>Vibe</span></h1><p>Crie sua conta</p></div>
        <div class="cartao">
            <h2>Cadastro</h2>
            <div class="grupo-input"><label>Nome completo</label><input type="text" id="nome-cad"></div>
            <div class="grupo-input"><label>E-mail</label><input type="email" id="email-cad"></div>
            <div class="grupo-input"><label>Senha</label><input type="password" id="senha-cad"></div>
            <div class="grupo-input"><label>Confirmar senha</label><input type="password" id="confirma-cad"></div>
            <button class="btn btn-principal" onclick="cadastrar()">Criar conta</button>
            <div class="link">Já tem conta? <span onclick="mostrarTela('tela-login')">Entrar</span></div>
        </div>
    </section>

    <!-- TELA APP PRINCIPAL -->
    <section id="tela-app" class="tela">
        <div class="cabecalho-app">
            <h2>Bem-vindo ao AquaVibe <span id="admin-badge" class="admin-badge">ADMIN</span></h2>
            <p>Olá, <strong id="user-nome">Usuário</strong></p>
            <div class="seletor-aquario" id="lista-aquarios"></div>
        </div>

        <!-- Grade Principal do Dashboard -->
        <div id="painel-principal" class="sub-tela sub-ativa">
            <div class="grade">
                <div class="card-funcao" onclick="mostrarSubTela('sub-monitoramento')">
                    <div class="icone">📊</div>
